<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Warm Dark Reader amber background -->
  <circle cx="24" cy="24" r="23" fill="#1f2122" stroke="#d35400" stroke-width="2"/>
  <!-- Dark Reader glasses -->
  <rect x="8" y="15" width="14" height="12" rx="3" fill="#0d0e0f" stroke="#e67e22" stroke-width="2.5"/>
  <rect x="26" y="15" width="14" height="12" rx="3" fill="#0d0e0f" stroke="#e67e22" stroke-width="2.5"/>
  <!-- Lens reflection glare -->
  <path d="M11 18 L19 24" stroke="rgba(230, 126, 34, 0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M29 18 L37 24" stroke="rgba(230, 126, 34, 0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bridge of glasses -->
  <path d="M22 20 C23 18, 25 18, 26 20" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sides / Temples -->
  <path d="M8 20 L3 18 M40 20 L45 18" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Subtle mouth line -->
  <path d="M18 34 C21 37, 27 37, 30 34" fill="none" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round"/>
</svg>
