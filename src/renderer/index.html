<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megabox</title>
  <!-- Tailwind CSS via Play CDN (Zero-build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @font-face {
      font-family: 'Linearicons';
      src: url('assets/Linearicons.woff') format('woff'),
           url('assets/Linearicons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    .lnr {
      font-family: 'Linearicons';
      speak: none;
      font-style: normal;
      font-weight: normal;
      font-variant: normal;
      text-transform: none;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
    }
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased" x-data="megaboxApp()" x-init="init()">

  <!-- Left Sidebar (Identical to Rambox vertical app bar) -->
  <aside class="w-16 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-3 justify-between z-20 flex-shrink-0">
    
    <!-- Top: Apps List -->
    <div class="flex flex-col items-center space-y-3 w-full overflow-y-auto overflow-x-hidden flex-1 px-2">
      
      <!-- Logo Megabox -->
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 mb-2 cursor-pointer">
        <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 15h6"/></svg>
      </div>

      <div class="w-8 h-px bg-slate-800 my-1"></div>

      <!-- App Tabs -->
      <template x-for="app in apps" :key="app.id">
        <div class="relative group flex items-center justify-center w-full">
          
          <!-- Active Indicator Bar -->
          <div class="absolute left-0 w-1 h-6 bg-cyan-400 rounded-r transition-all duration-200"
               :class="activeAppId === app.id ? 'opacity-100 scale-y-100' : 'opacity-0 scale-y-0'"></div>

          <!-- Tab Button -->
          <button @click="selectApp(app.id)"
                  :class="activeAppId === app.id ? 'bg-slate-800 ring-2 ring-cyan-500/50 text-white' : 'bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-slate-200'"
                  class="w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-150 relative shadow-sm">
            
            <!-- Preset Icons -->
            <template x-if="app.icon === 'whatsapp'">
              <svg class="w-6 h-6 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.043.073.043.419-.101.824z"/></svg>
            </template>
            <template x-if="app.icon === 'telegram'">
              <svg class="w-6 h-6 text-sky-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
            </template>
            <template x-if="app.icon === 'discord'">
              <svg class="w-6 h-6 text-indigo-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            </template>
            <template x-if="app.icon === 'gmail'">
              <svg class="w-6 h-6 text-red-400" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </template>
            <template x-if="!['whatsapp', 'telegram', 'discord', 'gmail'].includes(app.icon)">
              <span class="text-xs font-bold text-slate-300 uppercase" x-text="app.name.substring(0, 2)"></span>
            </template>

            <!-- Unread Badge (Rambox Style) -->
            <span x-show="badges[app.id] && badges[app.id] > 0"
                  x-text="badges[app.id] > 99 ? '99+' : badges[app.id]"
                  class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded-full border-2 border-slate-900 shadow-sm">
            </span>
          </button>

          <!-- Tooltip on hover -->
          <div class="absolute left-16 bg-slate-800 text-slate-200 text-xs font-medium px-2.5 py-1 rounded shadow-xl pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity z-50 whitespace-nowrap border border-slate-700">
            <span x-text="app.name"></span>
          </div>

        </div>
      </template>

      <!-- Add New Service Button (+) -->
      <button @click="showAddModal = true"
              class="w-11 h-11 rounded-xl border border-dashed border-slate-700 hover:border-cyan-500 text-slate-500 hover:text-cyan-400 flex items-center justify-center transition-all duration-150">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      </button>

    </div>

    <!-- Bottom Controls (Reload, Audio Mute, Settings) -->
    <div class="flex flex-col items-center space-y-2.5 w-full pt-3 border-t border-slate-800">
      
      <!-- Reload Current Tab -->
      <button @click="reloadActiveApp()" title="Reload Tab"
              class="w-9 h-9 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>

      <!-- Mute/Unmute Audio -->
      <button @click="toggleMuteActiveApp()" :title="isMuted ? 'Unmute Audio' : 'Mute Audio'"
              class="w-9 h-9 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors">
        <template x-if="!isMuted">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
        </template>
        <template x-if="isMuted">
          <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/></svg>
        </template>
      </button>

    </div>

  </aside>

  <!-- Main View Area (Webview Host) -->
  <main class="flex-1 h-full bg-slate-950 relative overflow-hidden">
    
    <!-- Empty State -->
    <div x-show="apps.length === 0" class="h-full flex flex-col items-center justify-center text-slate-500 space-y-3">
      <svg class="w-16 h-16 text-slate-700" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
      <p class="text-sm">No apps configured yet. Click (+) on sidebar to add WhatsApp or Telegram.</p>
    </div>

    <!-- Webview Containers -->
    <template x-for="app in apps" :key="app.id">
      <div class="w-full h-full absolute inset-0"
           :style="activeAppId === app.id ? 'display: block;' : 'display: none;'">
        <webview :id="'wv-' + app.id"
                 :src="app.url"
                 :partition="app.partition"
                 :useragent="app.user_agent || defaultUA"
                 preload="../main/preload-webview.js"
                 allowpopups
                 class="w-full h-full bg-slate-950">
        </webview>
      </div>
    </template>

  </main>

  <!-- Add App Modal -->
  <div x-show="showAddModal"
       class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
       style="display: none;">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-lg font-bold text-slate-100">Add New Service</h3>
        <button @click="showAddModal = false" class="text-slate-400 hover:text-slate-200">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Service Name</label>
          <input type="text" x-model="newAppForm.name" placeholder="e.g. WhatsApp Office"
                 class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Web URL</label>
          <input type="url" x-model="newAppForm.url" placeholder="https://web.whatsapp.com"
                 class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Icon / Preset</label>
          <select x-model="newAppForm.icon"
                  class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            <option value="whatsapp">WhatsApp</option>
            <option value="telegram">Telegram</option>
            <option value="discord">Discord</option>
            <option value="gmail">Gmail</option>
            <option value="custom">Custom / Other</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button @click="showAddModal = false"
                class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-colors">
          Cancel
        </button>
        <button @click="handleAddApp()"
                class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg text-sm shadow-md transition-all">
          Add to Megabox
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
