<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megabox</title>
  <script src="vendor/tailwind.js"></script>
  <style>
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body class="h-full flex overflow-hidden font-sans antialiased">

  <!-- Left Sidebar (Identical to Rambox vertical app bar) -->
  <aside class="w-16 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-3 justify-between z-20 flex-shrink-0">
    
    <!-- Top: Apps List -->
    <div class="flex flex-col items-center w-full overflow-y-auto overflow-x-hidden flex-1 px-2">
      
      <!-- Logo Megabox -->
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 mb-3 cursor-pointer">
        <svg class="w-6 h-6 text-white pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 3v18"/><path d="M15 9h6"/><path d="M15 15h6"/></svg>
      </div>

      <div class="w-8 h-px bg-slate-800 my-1 mb-3"></div>

      <!-- Container where JS appends tab buttons -->
      <div id="apps-list" class="flex flex-col items-center w-full"></div>

      <!-- Add New Service Button (+) -->
      <button id="btn-add-open"
              title="Add New Service"
              class="w-11 h-11 rounded-xl border border-dashed border-slate-700 hover:border-cyan-500 text-slate-500 hover:text-cyan-400 flex items-center justify-center transition-all duration-150 cursor-pointer">
        <svg class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
      </button>

    </div>

    <!-- Bottom Controls (Reload, Audio Mute) -->
    <div class="flex flex-col items-center space-y-2.5 w-full pt-3 border-t border-slate-800">
      
      <!-- Reload Current Tab -->
      <button id="btn-reload" title="Reload Tab"
              class="w-9 h-9 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors cursor-pointer">
        <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>

      <!-- Mute/Unmute Audio -->
      <button id="btn-mute" title="Toggle Mute Audio"
              class="w-9 h-9 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors cursor-pointer">
        <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
      </button>

    </div>

  </aside>

  <!-- Main View Area (Webview Host) -->
  <main id="webviews-container" class="flex-1 h-full bg-slate-950 relative overflow-hidden">
  </main>

  <!-- Add App Modal -->
  <div id="add-modal"
       class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
       style="display: none;">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-lg font-bold text-slate-100">Add New Service</h3>
        <button id="btn-add-cancel" class="text-slate-400 hover:text-slate-200 cursor-pointer text-xl">&times;</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Service Name</label>
          <input type="text" id="input-name" placeholder="e.g. WhatsApp Office"
                 class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Web URL</label>
          <input type="url" id="input-url" placeholder="https://web.whatsapp.com"
                 class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Icon / Preset</label>
          <select id="select-preset"
                  class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
            <option value="whatsapp">WhatsApp</option>
            <option value="telegram">Telegram</option>
            <option value="discord">Discord</option>
            <option value="gmail">Gmail</option>
            <option value="custom">Custom / Other</option>
          </select>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2">
        <button id="btn-add-cancel-2" onclick="document.getElementById('add-modal').style.display='none'"
                class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition-colors cursor-pointer">
          Cancel
        </button>
        <button id="btn-add-save"
                class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-lg text-sm shadow-md transition-all cursor-pointer">
          Add to Megabox
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
